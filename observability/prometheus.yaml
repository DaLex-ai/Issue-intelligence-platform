global:
  scrape_interval: 2s
  evaluation_interval: 5s
scrape_configs:
  - job_name: iip
    static_configs:
      - targets: [otel-collector:8889]
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics]
    static_configs:
      - targets: [rabbitmq:15692]

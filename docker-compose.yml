services:
  db:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - backend

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

    mem_limit: 512m
    cpus: 1.0

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

  app:
    build:
      context: .

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_MODEL_NAME: issue-priority-classifier
      MLFLOW_MODEL_ALIAS: champion
      RABBIT_URL: amqp://guest:guest@rabbitmq:5672/
      RABBIT_MAX_LENGTH: ${RABBIT_MAX_LENGTH:-20}
      ENABLE_BACKPRESSURE: ${ENABLE_BACKPRESSURE:-true}
      API_RETRY_AFTER_SECONDS: ${API_RETRY_AFTER_SECONDS:-0}
      API_PUBLISH_SLOTS: ${API_PUBLISH_SLOTS:-4}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      INFERENCE_DELAY_SECONDS: ${INFERENCE_DELAY_SECONDS:-0.5}

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    networks:
      - backend

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')",
        ]
      interval: 10s
      timeout: 3s
      retries: 3

    mem_limit: 512m
    cpus: 1.0

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: .
    command: ["python", "-m", "issue_intelligence_platform.pipeline.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_MODEL_NAME: issue-priority-classifier
      MLFLOW_MODEL_ALIAS: champion
      RABBIT_URL: amqp://guest:guest@rabbitmq:5672/
      RABBIT_MAX_LENGTH: ${RABBIT_MAX_LENGTH:-20}
      ENABLE_BACKPRESSURE: ${ENABLE_BACKPRESSURE:-true}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKER_PREFETCH_COUNT: ${WORKER_PREFETCH_COUNT:-2}
      INFERENCE_DELAY_SECONDS: ${INFERENCE_DELAY_SECONDS:-0.5}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      WORKER_RETRY_DELAY_SECONDS: ${WORKER_RETRY_DELAY_SECONDS:-0.25}
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/')"]
      interval: 5s
      timeout: 3s
      retries: 4
      start_period: 60s
    stop_grace_period: 75s
    mem_limit: 768m
    cpus: 2.0

  batch:
    build:
      context: .
    profiles: ["batch"]
    command: ["python", "-m", "issue_intelligence_platform.pipeline.batch", "/app/data/issues.jsonl"]
    volumes:
      - ./data:/app/data:ro
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      RABBIT_URL: amqp://guest:guest@rabbitmq:5672/
      RABBIT_MAX_LENGTH: ${RABBIT_MAX_LENGTH:-20}
      ENABLE_BACKPRESSURE: ${ENABLE_BACKPRESSURE:-true}
      BATCH_BACKOFF_MIN_SECONDS: ${BATCH_BACKOFF_MIN_SECONDS:-0.05}
      BATCH_BACKOFF_MAX_SECONDS: ${BATCH_BACKOFF_MAX_SECONDS:-1.0}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    mem_limit: 256m

  mlflow-db:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: ${MLFLOW_DB}
      POSTGRES_USER: ${MLFLOW_DB_USER}
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD}

    volumes:
      - mlflow_postgres_data:/var/lib/postgresql/data

    networks:
      - backend

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${MLFLOW_DB_USER} -d ${MLFLOW_DB}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "19000:9000"
      - "19001:9001"

    volumes:
      - minio_data:/data

    networks:
      - backend

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:9000/minio/health/live || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z

    depends_on:
      minio:
        condition: service_healthy

    networks:
      - backend

    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000
      ${MINIO_ROOT_USER}
      ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing
      local/${MLFLOW_ARTIFACT_BUCKET};
      exit 0;
      "

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow

    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000

    command: >
      /bin/sh -c "
      mlflow db upgrade
      postgresql+psycopg2://${MLFLOW_DB_USER}:${MLFLOW_DB_PASSWORD}@mlflow-db:5432/${MLFLOW_DB}
      &&
      mlflow server
      --backend-store-uri
      postgresql+psycopg2://${MLFLOW_DB_USER}:${MLFLOW_DB_PASSWORD}@mlflow-db:5432/${MLFLOW_DB}
      --artifacts-destination
      s3://${MLFLOW_ARTIFACT_BUCKET}
      --host 0.0.0.0
      --port 5000
      --allowed-hosts
      'localhost:5000,127.0.0.1:5000,mlflow:5000'
      "

    ports:
      - "5000:5000"

    depends_on:
      mlflow-db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

    networks:
      - backend

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres_data:
  rabbitmq_data:
  mlflow_postgres_data:
  minio_data:

networks:
  backend:
